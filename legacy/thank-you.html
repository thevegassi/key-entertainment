<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо | Key Entertainment</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="translations.js?v=3"></script>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; min-height: 100dvh; align-items: center; justify-content: center; text-align: center; padding: 40px 5%; }
        .check { font-size: 4rem; color: var(--accent); margin-bottom: 30px; animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .back-btn { display: inline-block; margin-top: 40px; background: var(--accent); color: #000; padding: 16px 40px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; text-decoration: none; font-size: 0.8rem; transition: 0.3s; }
        .back-btn:hover { background: #fff; }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KFJEKS7VYZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-KFJEKS7VYZ');
    </script>
</head>
<body>
    <div style="position:fixed;top:0;right:0;z-index:999;padding:16px 20px;">
        <div class="lang-switcher">
            <button class="lang-btn" data-lang="ru" onclick="applyLanguage('ru')">RU</button>
            <button class="lang-btn" data-lang="kz" onclick="applyLanguage('kz')">KZ</button>
            <button class="lang-btn" data-lang="en" onclick="applyLanguage('en')">EN</button>
        </div>
    </div>
    <div class="check">✓</div>
    <span style="color: var(--accent); letter-spacing: 4px; font-size: 0.75rem; font-weight: 900; display: block; margin-bottom: 20px;">KEY ENTERTAINMENT</span>
    <h1 style="font-size: clamp(2rem, 6vw, 4rem); font-weight: 900; text-transform: uppercase; line-height: 1; margin-bottom: 24px;" data-i18n="thankyou_title">ЗАЯВКА<br>ОТПРАВЛЕНА</h1>
    <p style="color: #888; font-size: 1rem; max-width: 500px; line-height: 1.7;" data-i18n="thankyou_sub">Мы получили ваше сообщение и свяжемся с вами в ближайшее время на указанный email.</p>
    <a href="/" class="back-btn" data-i18n="thankyou_btn">← НА ГЛАВНУЮ</a>
    <div style="position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:0.55rem;letter-spacing:1.5px;opacity:0.3;flex-wrap:wrap;display:flex;justify-content:center;gap:20px;padding:0 20px;">
        <span data-i18n="footer_copy">ТОО «KEY ENTERTAINMENT» · БИН 231240023174 · © 2015–2026 ALL RIGHTS RESERVED.</span>
        <a href="/privacy" style="color:#fff;text-decoration:none;" data-i18n="footer_privacy">КОНФИДЕНЦИАЛЬНОСТЬ</a>
        <a href="/offer" style="color:#fff;text-decoration:none;" data-i18n="footer_offer">ОФЕРТА</a>
    </div>

    <script>
        // Инициализация языка — запускаем сразу после загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            var lang = localStorage.getItem('key_lang') || 'ru';
            if (typeof window.applyLanguage === 'function') {
                window.applyLanguage(lang);
            }
        });

        // Защита контента
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            // Блокируем Ctrl+S, Ctrl+U, Ctrl+A, F12, Ctrl+Shift+I/J/C
            if ((e.ctrlKey || e.metaKey) && ['s','u','a','p'].includes(e.key.toLowerCase())) e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) e.preventDefault();
        });
        // Блокируем drag изображений
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('dragstart', e => e.preventDefault());
        });
    </script>
</body>
</html>
