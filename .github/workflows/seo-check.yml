name: SEO check
# Блокирует слияние PR, если SEO-проверка не пройдена (включите как Required check в Settings → Branches).
on:
  pull_request:
  push:
    branches: [main]
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Start server
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf localhost:3000/robots.txt >/dev/null && break; sleep 1; done
      - name: SEO check (блокирует публикацию при ошибках)
        run: node scripts/seo-check.mjs
